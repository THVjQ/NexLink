// :social-contract — docs/social/10-modules.md §10.3.1
//
// The ONLY social module :app is permitted to see. It contains the Parcelable
// types and AIDL definitions for the cross-app link (§16.4) and nothing else:
// no SDK, no networking, no Android dependencies beyond Parcelable.
//
// Without it, :app would need :social-core to know what a conversation looks
// like, which reintroduces exactly the coupling §10.1 forbids.
//
// If you are about to add a dependency here, you are probably about to break
// the thing this module exists to protect.
plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.parcelize)
}

android {
    namespace 'com.nexlink.social.contract'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        // NO default for nexlinkBridgePermission on purpose.
        //
        // A library's own manifestPlaceholders win over the consuming app's for
        // entries in the library's manifest, so a default here is not a
        // fallback — it is an override that silently defeats the whole point.
        // Measured: with a default set, the debug APK's <uses-permission> took
        // the app's suffixed value while the <permission> declaration kept the
        // library's, so the two variants still collided on install and the
        // uses-permission referred to a permission nothing declared.
        //
        // Left undefined, the placeholder resolves at app-merge time from
        // whichever app is consuming it, which is the intended behaviour.
        minSdk libs.versions.minSdk.get().toInteger()
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildFeatures { aidl true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    // Intentionally empty. See the header.
    testImplementation libs.junit
    testImplementation libs.robolectric
}
