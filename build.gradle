plugins {
    id 'com.android.application' version '8.2.0' apply false
    id 'com.android.library'     version '8.2.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
    id 'org.jetbrains.kotlin.plugin.parcelize' version '1.9.22' apply false
    // §13.3 — FCM. Applied only in :social; :app must never gain it (§16.8).
    id 'com.google.gms.google-services' version '4.4.2' apply false
}

// ─────────────────────────────────────────────────────────────────────────────
// NexLink Social lives in THVjQ/NexLink-Social since 2026-09-21.
//
// §10.4 used to enforce here that :app could not link the social stack. With
// the social modules in another repository that rule is structural rather than
// checked — but the failure it guarded against is now "someone copies the
// modules back in", so the guard is kept pointing that way.
//
// §1.5, success criterion 1: a NexLink user who never enables Social is
// unaffected. That collapses the moment :app links social code.
// ─────────────────────────────────────────────────────────────────────────────
gradle.projectsEvaluated {
    def social = ['social', 'social-core', 'social-rtc', 'social-ui', 'social-contract']
    def present = social.findAll { findProject(":$it") != null }
    if (!present.isEmpty()) {
        throw new GradleException(
            "Social modules found in the NexLink repository: ${present.join(', ')}.\n" +
            "  They belong in THVjQ/NexLink-Social. Two repositories building the same\n" +
            "  app is how they come to disagree — and the Social app ships legal\n" +
            "  documents, which is where disagreeing actually matters.")
    }
}
