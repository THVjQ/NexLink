# Version catalogue — §10.6.1
#
# Introduced with the social modules so that five new build files do not each
# hard-code their own versions. The EXISTING modules (:app, :shared, :wear) have
# deliberately NOT been migrated in this change: §10.10 asks for that migration
# as its own reviewable diff, and :app/build.gradle currently carries unrelated
# uncommitted work. Migrate them separately.

[versions]
agp             = "8.2.0"
kotlin          = "1.9.22"
compileSdk      = "36"
minSdk          = "26"
targetSdk       = "36"

coreKtx         = "1.12.0"
appcompat       = "1.6.1"
material        = "1.11.0"
constraintlayout = "2.1.4"
fragmentKtx     = "1.6.2"
lifecycle       = "2.7.0"
recyclerview    = "1.3.2"
coroutines      = "1.7.3"

# §11 — matrix-rust-sdk Kotlin bindings. Verified on Maven Central 2026-09-11:
# org.matrix.rustcomponents:sdk-android:26.09.9, published 2026-09-09.
# The Maven Central SEARCH API reports 25.5.26 and is stale — read
# repo1.maven.org/.../maven-metadata.xml instead, which is authoritative.
matrixRustSdk   = "26.09.9"

junit           = "4.13.2"
androidxTestExt = "1.1.5"
espresso        = "3.5.1"
robolectric     = "4.11.1"
securityCrypto  = "1.1.0-alpha06"
okhttp          = "4.12.0"

[libraries]
androidx-core-ktx        = { module = "androidx.core:core-ktx",                       version.ref = "coreKtx" }
androidx-appcompat       = { module = "androidx.appcompat:appcompat",                 version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout",  version.ref = "constraintlayout" }
androidx-fragment-ktx    = { module = "androidx.fragment:fragment-ktx",               version.ref = "fragmentKtx" }
androidx-recyclerview    = { module = "androidx.recyclerview:recyclerview",           version.ref = "recyclerview" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
google-material          = { module = "com.google.android.material:material",         version.ref = "material" }
matrix-rust-sdk          = { module = "org.matrix.rustcomponents:sdk-android",          version.ref = "matrixRustSdk" }

kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

junit                    = { module = "junit:junit",                                  version.ref = "junit" }
kotlinx-coroutines-test  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-test-ext-junit  = { module = "androidx.test.ext:junit",                       version.ref = "androidxTestExt" }
androidx-test-espresso   = { module = "androidx.test.espresso:espresso-core",          version.ref = "espresso" }
okhttp                   = { module = "com.squareup.okhttp3:okhttp",                     version.ref = "okhttp" }
androidx-security-crypto = { module = "androidx.security:security-crypto",            version.ref = "securityCrypto" }
robolectric              = { module = "org.robolectric:robolectric",                   version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application",        version.ref = "agp" }
android-library     = { id = "com.android.library",            version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",   version.ref = "kotlin" }
kotlin-parcelize    = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
