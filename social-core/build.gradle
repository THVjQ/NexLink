// :social-core — docs/social/10-modules.md §10.3, §11.6
//
// Owns the Matrix session, store, crypto and sync. Exposes SocialSession — the
// APPLICATION's vocabulary, not the SDK's — and nothing outside this module
// imports an SDK type (§11.6).
//
// No SDK dependency is declared yet: §11 is resolved in phase 2 (§33.3), and
// the whole point of the seam is that this module can be written, and the UI
// built against it, before that decision is made.
plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.nexlink.social.core'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        // §16.3.1 — :social-core merges :social-contract's manifest, which
        // declares the bridge permission with a placeholder name and
        // deliberately supplies no default (see the note there). Every consumer
        // must therefore define it, including this one, or the merge fails with
        //   requires a placeholder substitution but no value for
        //   <nexlinkBridgePermission> is provided
        // This value is never installed — :social-core is a library and its
        // only APK is the instrumentation test — so it just has to resolve.
        manifestPlaceholders = [
            nexlinkBridgePermission: 'com.thvjq.nexlink.permission.SOCIAL_BRIDGE.coretest'
        ]
        minSdk libs.versions.minSdk.get().toInteger()
        // §11.7's decision procedure runs as an instrumented test against the
        // real homeserver — the SDK is native code and cannot run on the JVM.
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }

    testOptions { unitTests { includeAndroidResources = true } }
}

dependencies {
    implementation project(':social-contract')
    implementation libs.kotlinx.coroutines.core

    // §11 — the Matrix SDK. THIS IS THE ONLY MODULE ALLOWED TO DECLARE IT.
    // tools/check-invariants.sh fails the build if an SDK type is imported from
    // :social, :social-ui or :social-contract (§11.6). That seam is what makes
    // a wrong answer in §11 a one-module rewrite instead of an application one.
    implementation libs.matrix.rust.sdk
    // Mandatory companion to the SDK — see :rustls-tls/VENDORED.md.
    implementation project(':rustls-tls')
    implementation libs.androidx.core.ktx
    // §12.4 — the session tokens are encrypted at rest with a Keystore-backed
    // key. NexLink already depends on this library (§10.7).
    implementation libs.androidx.security.crypto
    // §11.7.3 / §22.10 — registration and device management are not in the SDK,
    // so :social-core also speaks the raw Client-Server API. NexLink already
    // carries OkHttp (§10.7).
    implementation libs.okhttp

    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test

    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.kotlinx.coroutines.test
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
}
