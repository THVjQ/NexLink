// :social-ui — docs/social/10-modules.md §10.3
//
// Depends on :social-core's SocialSession, NEVER on the SDK (§11.6). That is
// what makes an SDK change (§11) a rewrite of one module rather than of the
// application, and it is what lets these screens be built and tested before the
// SDK decision is made in phase 2 (§33.3).
//
// §10.10 leans toward folding this into :social initially. It is kept separate
// because §33.1 asks for it and because the boundary is the thing being
// enforced — folding it in later is a cheap change; unpicking it is not.
plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.nexlink.social.ui'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
        // §16.3.1 — the same substitution :social-core has to make, and for the
        // same reason: :social-contract declares the bridge permission with a
        // placeholder and deliberately supplies no default, so every module
        // that transitively merges its manifest must name one or the merge
        // fails with "requires a placeholder substitution". It only became
        // necessary here when the unit tests started processing a manifest
        // (`includeAndroidResources`, below).
        //
        // The value is never installed. Verified rather than assumed: the
        // debug APK's merged manifest contains only
        // com.thvjq.nexlink.permission.SOCIAL_BRIDGE.debug — neither this nor
        // :social-core's `.coretest` reaches it.
        manifestPlaceholders = [
            nexlinkBridgePermission: 'com.thvjq.nexlink.permission.SOCIAL_BRIDGE.uitest'
        ]
    }

    // Chrome builds views in code, so the things most likely to break in it are
    // measured, not typed: a control that comes out 0dp wide, a bubble that
    // ignores its width cap. Robolectric is the only way to assert those
    // without a handset, and §34.10 rules the emulator out.
    testOptions { unitTests { includeAndroidResources = true } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    api project(':social-core')

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.google.material
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.kotlinx.coroutines.android

    testImplementation libs.junit
    testImplementation libs.robolectric
}
