pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = "NexLink"

// ── NexLink ───────────────────────────────────────────────────────────────
include ':app'                 // com.thvjq.nexlink — SMS, dialer, inbox, bridge
include ':shared'              // shared models and helpers
include ':wear'                // Wear OS companion

// NexLink Social moved to THVjQ/NexLink-Social on 2026-09-21.
//
// The two apps never shared code — :app and :wear depend only on :shared, and
// no source file here ever imported com.nexlink.social. §1.5's first success
// criterion is that a NexLink user who never enables Social is unaffected, and
// a repository boundary is the strongest form that rule can take.
//
// Do not re-add the social modules here. Both repositories building the same
// app is how they come to disagree, and the legal documents the Social app
// ships are the part where disagreeing actually matters.
