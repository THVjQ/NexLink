// :social — docs/social/10-modules.md §10.3, §10.5
//
// com.thvjq.nexlink.social. Its own application ID, its own version, its own
// Play listing and its own review queue — that separation IS D1 (§2.2), and it
// is why a policy problem here cannot remove the user's SMS client and dialer
// (§1.4.3).
plugins {
    // §13.3 — reads social/google-services.json, which is gitignored. The build
    // must still work without it for anyone who clones this repo, so the plugin
    // is applied conditionally below rather than here.
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

// §10.5.1 — both apps sign with the same keystore, which is what makes the
// signature-level permission in §16.3.1 possible. Losing it breaks both
// products and the cross-app link irrecoverably (§21.6).
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.nexlink.social'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        applicationId "com.thvjq.nexlink.social"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        // §10.5 — deliberately independent of :app's. Locking them together
        // would recreate the fused release train D1 exists to prevent (§1.4.3).
        versionCode 1
        versionName "0.1.0"
        // §16.3.1 — the bridge permission's name. A custom permission is owned
        // account-wide by the first package to declare it, so debug and release
        // must not share one or they cannot both be installed. See the comment
        // in :social-contract's manifest.
        manifestPlaceholders = [
            nexlinkBridgePermission: 'com.thvjq.nexlink.permission.SOCIAL_BRIDGE'
        ]
    }

    signingConfigs {
        release {
            storeFile     rootProject.file("app/${keystoreProperties['storeFile'] ?: 'nexlink-release.jks'}")
            storePassword keystoreProperties['storePassword']
            keyAlias      keystoreProperties['keyAlias'] ?: 'nexlink'
            keyPassword   keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            // Its own permission name, matching its own applicationId suffix,
            // so a debug and a release build coexist on one phone.
            manifestPlaceholders = [
                nexlinkBridgePermission: 'com.thvjq.nexlink.permission.SOCIAL_BRIDGE.debug'
            ]
        }
        release {
            if (keystorePropertiesFile.exists()) signingConfig signingConfigs.release
            // §10.6.3 — R8 from the FIRST release. Retrofitting minification to
            // a large app with reflection-based SDK code is painful; starting
            // with it means keep-rules grow alongside the code that needs them.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // §10.6.2 — :social will carry native libraries (WebRTC certainly, and the
    // Matrix SDK too if the Rust path is taken). App Bundle splits them per ABI
    // so each device downloads one. This is why :social must ship as an AAB and
    // never as a universal APK.
    bundle {
        abi { enableSplit true }
        density { enableSplit true }
        language { enableSplit true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    implementation project(':social-ui')      // brings :social-core transitively (api)
    implementation project(':social-contract')
    implementation project(':social-rtc')     // §19 Telecom, §17 call state (phase 4)

    // §13.3 — FCM. Confined to :social; nothing in :social-core or :app sees it,
    // so §13.3.3's "abstracted enough that UnifiedPush is an addition rather
    // than a rewrite" stays true.
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.messaging

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.google.material
    implementation libs.kotlinx.coroutines.android

    testImplementation libs.junit

    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
}

// §13.3 — apply the Google Services plugin only when EVERY variant has a client.
//
// google-services.json is gitignored (this repository is public), so a clean
// clone has no copy at all. And the file the operator downloads covers only the
// packages registered in Firebase: with the release package registered and
// `.debug` not, `assembleDebug` fails with
//
//   No matching client found for package name 'com.thvjq.nexlink.social.debug'
//
// which would leave the debug variant unbuildable — and the debug variant is
// what everything else in this repo is tested against, including §8.4's
// two-device verification, which needs debug and release installed together.
//
// So the plugin is applied only when the config covers both applicationIds.
// Push is a feature that is absent without it; the build is not a casualty.
def gsFile = file('google-services.json')
def gsCovers = { ->
    if (!gsFile.exists()) return false
    def json = new groovy.json.JsonSlurper().parse(gsFile)
    def packages = json.client.collect { it.client_info.android_client_info.package_name }
    return packages.contains('com.thvjq.nexlink.social') &&
           packages.contains('com.thvjq.nexlink.social.debug')
}

if (gsCovers()) {
    apply plugin: 'com.google.gms.google-services'
} else if (gsFile.exists()) {
    logger.lifecycle(":social — google-services.json does not cover both debug and release; " +
                     "building WITHOUT push (§13.3). Add com.thvjq.nexlink.social.debug in Firebase.")
} else {
    logger.lifecycle(":social — no google-services.json, building without push (§13.3)")
}
